spring:
  application:
    name: task-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Defaults abaixo servem pra dev local/teste tecnico. Em qualquer ambiente real,
# defina as env vars (DB_*, JWT_SECRET) - nunca suba um secret de verdade aqui.
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-should-be-at-least-256-bits-long-for-hs256}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    refresh-cleanup-retention-days: ${JWT_REFRESH_CLEANUP_RETENTION_DAYS:30}
  rate-limit:
    capacidade: ${RATE_LIMIT_CAPACIDADE:5}
    janela-minutos: ${RATE_LIMIT_JANELA_MINUTOS:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
