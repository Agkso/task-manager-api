server:
  port: ${PORT:8080}

spring:
  application:
    name: task-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:nao-e-um-secret-de-verdade-defina-JWT_SECRET-no-ambiente-taskmanager-dev-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    refresh-cleanup-retention-days: ${JWT_REFRESH_CLEANUP_RETENTION_DAYS:30}
  rate-limit:
    capacidade: ${RATE_LIMIT_CAPACIDADE:5}
    janela-minutos: ${RATE_LIMIT_JANELA_MINUTOS:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    remetente: ${EMAIL_REMETENTE:onboarding@resend.dev}
