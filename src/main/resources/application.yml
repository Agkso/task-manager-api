spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanager
    username: taskmanager
    password: taskmanager

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# TODO: move to env var / secrets manager before this goes anywhere near production.
app:
  jwt:
    secret: change-this-secret-should-be-at-least-256-bits-long-for-hs256
    expiration-minutes: 60
    refresh-expiration-days: 7
