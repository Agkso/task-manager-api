spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# TODO: move to env var before anything resembling production; fine for a local/H2 challenge run.
app:
  jwt:
    secret: change-this-secret-should-be-at-least-256-bits-long-for-hs256
    expiration-minutes: 60
