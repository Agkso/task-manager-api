name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers precisa de Docker pra subir o Postgres descartavel -
      # os runners hospedados do GitHub ja vem com Docker instalado, nao
      # precisa de setup extra.
      - name: Rodar testes
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
